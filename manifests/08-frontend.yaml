apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-content
  namespace: fullstack
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kubernetes-fullstack-lab
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Kubernetes Resilient Stack</title>
      <style>
        :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; background: #07111f; color: #e8f1ff; }
        main { width: min(820px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0; }
        .eyebrow { color: #64ffda; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        h1 { font-size: clamp(2.2rem, 7vw, 4.8rem); line-height: .98; margin: 12px 0 20px; }
        .lead { color: #a9b8cf; max-width: 680px; font-size: 1.08rem; line-height: 1.7; }
        .panel { margin-top: 36px; padding: 24px; border: 1px solid #203450; border-radius: 18px; background: #0c1a2c; box-shadow: 0 24px 60px #0006; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .status { display: inline-flex; align-items: center; gap: 8px; color: #a9b8cf; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #f3b33d; }
        .ok .dot { background: #64ffda; box-shadow: 0 0 14px #64ffda; }
        button { cursor: pointer; color: #07111f; background: #64ffda; border: 0; border-radius: 9px; padding: 10px 16px; font-weight: 800; }
        ul { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 10px; }
        li { padding: 14px 16px; border-radius: 10px; background: #12243a; color: #d7e4f7; }
        .meta { margin-top: 24px; color: #7285a0; font-size: .9rem; }
      </style>
    </head>
    <body>
      <main>
        <div class="eyebrow">Internship Project</div>
        <h1>Resilient Kubernetes Full Stack</h1>
        <p class="lead">A three-node kubeadm cluster serving live PostgreSQL data through PostgREST and nginx, with Longhorn replication and MetalLB access.</p>
        <section class="panel">
          <div class="row">
            <div id="status" class="status"><span class="dot"></span><span>Loading database data...</span></div>
            <button type="button" id="refresh">Refresh</button>
          </div>
          <ul id="items"><li>Waiting for the API</li></ul>
          <div class="meta">Request path: MetalLB -> frontend -> backend -> PostgreSQL -> Longhorn</div>
        </section>
      </main>
      <script>
        const statusNode = document.getElementById('status');
        const itemsNode = document.getElementById('items');
        async function loadItems() {
          statusNode.classList.remove('ok');
          statusNode.lastElementChild.textContent = 'Contacting the API...';
          try {
            const response = await fetch('/api/items?select=id,name,created_at&order=id.asc', { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const rows = await response.json();
            itemsNode.replaceChildren(...rows.map(row => {
              const item = document.createElement('li');
              item.textContent = `${row.id}: ${row.name}`;
              return item;
            }));
            statusNode.classList.add('ok');
            statusNode.lastElementChild.textContent = `${rows.length} PostgreSQL rows loaded`;
          } catch (error) {
            itemsNode.innerHTML = '<li>The data path is temporarily unavailable.</li>';
            statusNode.lastElementChild.textContent = `Unavailable: ${error.message}`;
          }
        }
        document.getElementById('refresh').addEventListener('click', loadItems);
        loadItems();
      </script>
    </body>
    </html>
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fullstack
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kubernetes-fullstack-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: kubernetes-fullstack-lab
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      containers:
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: frontend-content
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fullstack
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kubernetes-fullstack-lab
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: fullstack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend

