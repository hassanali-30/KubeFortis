name: Validate Kubernetes project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run project checks
        run: python tools/validate_manifests.py

      - name: Check shell scripts
        run: shellcheck cluster/*.sh scripts/*.sh

      - name: Install Kubeconform
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: Validate against Kubernetes schemas
        run: >-
          kubeconform
          -strict
          -summary
          -kubernetes-version 1.36.0
          -ignore-filename-pattern '.*example.*|kustomization.yaml'
          manifests
