apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: fullstack
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubefortis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-2replica
  resources:
    requests:
      storage: 5Gi

