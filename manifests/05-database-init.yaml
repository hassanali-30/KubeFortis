apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init
  namespace: fullstack
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubefortis
data:
  01-init.sql: |
    CREATE SCHEMA IF NOT EXISTS api;

    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'web_anon') THEN
        CREATE ROLE web_anon NOLOGIN;
      END IF;
    END
    $$;

    CREATE TABLE IF NOT EXISTS api.items (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      name text NOT NULL CHECK (char_length(name) BETWEEN 1 AND 120),
      created_at timestamptz NOT NULL DEFAULT now()
    );

    INSERT INTO api.items (name)
    SELECT seed.name
    FROM (VALUES
      ('first item from PostgreSQL'),
      ('second item from PostgreSQL')
    ) AS seed(name)
    WHERE NOT EXISTS (SELECT 1 FROM api.items);

    GRANT USAGE ON SCHEMA api TO web_anon;
    GRANT SELECT ON api.items TO web_anon;

